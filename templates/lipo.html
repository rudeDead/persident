{% extends "base.html" %}

{% block title %}Lipophilicity Prediction{% endblock %}

{% block content %}
<div class="main-content">
    <div class="property-header">
        <h2>🧪 Lipophilicity Prediction</h2>
        <p>Predict lipophilicity (logP) with explainable AI</p>
    </div>
    
    <div class="input-section">
        <div class="input-group">
            <label for="smiles-input">Enter SMILES String:</label>
            <input type="text" id="smiles-input" placeholder="e.g., c1ccccc1 (benzene)" />
        </div>
        
        <div class="button-group">
            <button class="btn-primary" onclick="predictProperty('lipo')">🔍 Predict Lipophilicity</button>
            <button class="btn-secondary" onclick="document.getElementById('smiles-input').value = ''">🗑️ Clear</button>
        </div>
        
        <div class="examples">
            <h4>Quick Examples:</h4>
            <div class="example-buttons">
                <button class="example-btn" onclick="loadExample('CO[C@H]1CN(CCN2C(=O)C=Cc3ccc(cc23)C#N)CC[C@H]1NCc4ccc5OCC(=O)Nc5n4')">CO[C@H]1CN(CCN2C(=O)C=Cc3ccc(cc23)C#N)CC[C@H]1NCc4ccc5OCC(=O)Nc5n4</button>
                <button class="example-btn" onclick="loadExample('COc1cc(OC)c(cc1NC(=O)C)S(=O)(=O)NCc2ccccc2N3CCC(CO)CC3')">COc1cc(OC)c(cc1NC(=O)C)S(=O)(=O)NCc2ccccc2N3CCC(CO)CC3</button>
                <button class="example-btn" onclick="loadExample('CN1CCCC1CCOC(C)(c2ccccc2)c3ccc(Cl)cc3')">CN1CCCC1CCOC(C)(c2ccccc2)c3ccc(Cl)cc3</button>
                <button class="example-btn" onclick="loadExample('CCN(C1CCN(CC[C@H](C2CCN(CC2)S(=O)(=O)C)c3ccccc3)CC1)C(=O)Cc4ccc(cc4)S(=O)(=O)C')">CCN(C1CCN(CC[C@H](C2CCN(CC2)S(=O)(=O)C)c3ccccc3)CC1)C(=O)Cc4ccc(cc4)S(=O)(=O)C</button>
            </div>
        </div>
    </div>
    
    <div id="loading">
        <div class="spinner"></div>
        <p>Computing MB-EIG explanation...</p>
    </div>
    
    <div id="error"></div>
    
    <div id="results"></div>
</div>
{% endblock %}
